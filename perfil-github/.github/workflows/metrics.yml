name: Metricas de GitHub

on:
  schedule:
    # Se regenera una vez al dia (02:15 UTC)
    - cron: "15 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generar metrics.svg
        uses: lowlighter/metrics@latest
        with:
          # Usa el PAT METRICS_TOKEN si existe; si no, el token automatico del repo.
          # Con el automatico funciona igual para datos publicos (basta para este README).
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: alejcuevas97
          filename: metrics.svg
          template: classic
          base: header, activity, repositories
          config_timezone: America/Havana

          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
